services:
  # ========================================================
  # Backend FastAPI Web Service
  # ========================================================
  - type: web
    name: medivoice-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.seed_data
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

  # ========================================================
  # Frontend React Static Site
  # ========================================================
  - type: web
    name: medivoice-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medivoice-backend
          property: host
